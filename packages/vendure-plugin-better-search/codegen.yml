schema:
  - 'src/api/api-extensions.ts'
  - '../../node_modules/@vendure/core/dist/api/schema/common/*.graphql'
  - '../../node_modules/@vendure/core/dist/api/schema/admin-api/*.graphql'
generates:
  ./src/api/generated/graphql.ts:
    plugins:
      - typescript
      - typescript-operations
      - typed-document-node
    config:
      enumsAsTypes: true
      enumValues:
        Permission: '@vendure/common/lib/generated-types#Permission'
      avoidOptionals: false
      scalars:
        DateTime: Date
        ID: string | number
